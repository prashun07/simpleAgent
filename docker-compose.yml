services:
  ollama:
    image: ollama/ollama:latest
    container_name: eka-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Optional: run the assistant API in Docker
  # api:
  #   build: .
  #   ports:
